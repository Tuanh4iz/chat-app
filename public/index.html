<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat Ấm Áp</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .login-screen {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      color: #f8fafc;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      transition: all 0.4s ease;
    }
    .login-screen.hidden { display: none; }
    .login-screen .logo {
      font-size: 48px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .login-screen p { color: #a0aec0; margin-bottom: 28px; font-size: 15px; }
    .login-screen label {
      display: block;
      text-align: left;
      font-weight: 500;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .login-screen input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }
    .login-screen input:focus {
      border-color: #f5576c;
      box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.3);
    }
    .login-screen .btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 24px rgba(245, 87, 108, 0.4);
    }
    .login-screen .btn:hover { transform: scale(1.02); box-shadow: 0 12px 32px rgba(245, 87, 108, 0.6); }
    .login-screen .error { color: #f87171; font-size: 14px; margin-top: 10px; min-height: 22px; }

    .chat-container {
      width: 100%;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 750px;
      transition: all 0.3s ease;
    }
    .chat-container.hidden { display: none; }

    .chat-header {
      padding: 18px 28px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chat-header .left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .chat-header .left .room-icon {
      font-size: 28px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .chat-header .left .room-name {
      font-weight: 700;
      font-size: 20px;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }
    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 16px 4px 12px;
      border-radius: 30px;
    }
    .chat-header .user-info .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .chat-header .user-info .name { font-weight: 600; color: #f8fafc; }
    .chat-header .status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-header .status .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.online { background: #4ade80; box-shadow: 0 0 12px #4ade80; }
    .dot.offline { background: #f87171; }
    .dot.connecting { background: #fbbf24; animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    .chat-header .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tiktok-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 22px;
      text-decoration: none;
      transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tiktok-btn:hover {
      background: #000;
      transform: scale(1.1);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.15);
    }

    .chat-messages {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

    .message {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 22px;
      animation: slideUp 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      position: relative;
    }
    .message.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 6px;
    }
    .message.system {
      align-self: center;
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-style: italic;
      font-size: 13px;
      padding: 6px 20px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      max-width: 90%;
      box-shadow: none;
    }
    .message .username {
      font-weight: 600;
      font-size: 13px;
      color: #fbbf24;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .message.mine .username { color: #fde68a; }
    .message .text {
      word-wrap: break-word;
      line-height: 1.5;
    }
    .message .time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 6px;
      text-align: right;
    }
    .message.mine .time { color: rgba(255, 255, 255, 0.6); }
    .message img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 14px;
      margin-top: 8px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-footer {
      padding: 14px 24px 10px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-row input[type="text"] {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .input-row input[type="text"]:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: #f5576c;
    }
    .input-row input[type="text"]::placeholder { color: #94a3b8; }
    .input-row input[type="file"] { display: none; }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.3);
    }
    .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 28px rgba(245, 87, 108, 0.5);
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.3s;
      color: #cbd5e1;
      font-size: 22px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      transform: scale(1.05);
    }
    .image-preview {
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .image-preview img {
      max-height: 60px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .image-preview .remove-img {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .image-preview .remove-img:hover {
      background: #ef4444;
      transform: scale(1.1);
    }

    /* === DÒNG CHỮ THÔNG BÁO NHỎ === */
    .chat-footer .footer-note {
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .chat-footer .footer-note span {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    /* ===== MUSIC PLAYER ===== */
    .music-player {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 60px;
      padding: 10px 18px 10px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      z-index: 999;
      max-width: 340px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      color: #f8fafc;
    }
    .music-player.collapsed {
      border-radius: 50%;
      padding: 12px;
      max-width: 56px;
      gap: 0;
      background: rgba(0, 0, 0, 0.8);
    }
    .music-player.collapsed .player-info,
    .music-player.collapsed .player-controls,
    .music-player.collapsed .volume-control { display: none; }
    .music-player .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .music-player .player-info .cover {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      animation: spin 8s linear infinite paused;
    }
    .music-player.playing .player-info .cover { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .music-player .player-info .song-title {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .music-player .player-info .song-artist {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .music-player .player-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-player .player-controls button {
      background: none;
      border: none;
      color: #f8fafc;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-player .player-controls button:hover { color: #f5576c; transform: scale(1.15); }
    .music-player .volume-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-player .volume-control input[type="range"] {
      width: 60px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
    }
    .music-player .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f5576c;
      cursor: pointer;
    }
    .music-player .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border-radius: 0 0 60px 60px;
      transition: width 0.1s linear;
      width: 0%;
    }
    .music-player .toggle-expand {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }
    .music-player .toggle-expand:hover { color: #f8fafc; }

    @media (max-width: 640px) {
      body { padding: 8px; }
      .login-screen { padding: 32px 20px; border-radius: 28px; }
      .chat-container { border-radius: 24px; height: 95vh; max-height: none; }
      .chat-header { padding: 14px 18px; }
      .chat-header .left .room-name { font-size: 17px; }
      .chat-messages { padding: 14px 16px; }
      .message { max-width: 90%; padding: 10px 14px; }
      .input-row input[type="text"] { font-size: 14px; padding: 12px 16px; }
      .btn { padding: 10px 18px; font-size: 14px; }
      .btn-icon { width: 44px; height: 44px; font-size: 18px; }
      .chat-footer .footer-note { font-size: 10px; }

      .music-player {
        bottom: 10px;
        right: 10px;
        left: 10px;
        width: auto;
        max-width: 100%;
        border-radius: 60px;
        padding: 6px 12px 6px 16px;
        gap: 8px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
      }
      .music-player .player-info .cover {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }
      .music-player .player-info .song-title {
        font-size: 12px;
        max-width: 100px;
      }
      .music-player .player-info .song-artist {
        font-size: 10px;
        max-width: 100px;
      }
      .music-player .player-controls button {
        font-size: 16px;
        padding: 2px 4px;
      }
      .music-player .volume-control {
        display: none;
      }
      .music-player .toggle-expand {
        font-size: 12px;
        padding: 0 2px;
      }
      .music-player .progress-bar {
        height: 2px;
      }
      .music-player.collapsed {
        border-radius: 50%;
        padding: 10px;
        max-width: 48px;
        left: auto;
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="logo"><i class="fas fa-comment-dots"></i></div>
  <h1>Chào bạn 👋</h1>
  <p>Nhập tên để tham gia phòng chat</p>
  <form id="loginForm" autocomplete="off">
    <label for="nameInput">Tên của bạn</label>
    <input type="text" id="nameInput" placeholder="VD: Phan Hải" required />
    <div class="error" id="loginError"></div>
    <button type="submit" class="btn">Vào phòng chat</button>
  </form>
</div>

<!-- CHAT -->
<div class="chat-container hidden" id="chatContainer">
  <div class="chat-header">
    <div class="left">
      <span class="room-icon"><i class="fas fa-comment-dots"></i></span>
      <span class="room-name">Phòng chat</span>
      <div class="user-info">
        <div class="avatar" id="userAvatar">?</div>
        <span class="name" id="displayName">User</span>
        <span class="status">
          <span class="dot connecting" id="statusDot"></span>
          <span id="statusLabel">Đang kết nối...</span>
        </span>
      </div>
    </div>
    <div class="right">
      <a href="https://www.tiktok.com/@twuan.hai?lang=vi-VN" target="_blank" rel="noopener noreferrer" class="tiktok-btn" title="TikTok của tôi">
        <i class="fab fa-tiktok"></i>
      </a>
    </div>
  </div>

  <div class="chat-messages" id="messageBox"></div>

  <div class="chat-footer">
    <div class="image-preview" id="imagePreview" style="display:none;">
      <img id="previewImg" src="#" alt="preview" />
      <button class="remove-img" id="removeImageBtn">✕</button>
    </div>
    <div class="input-row">
      <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." />
      <button class="btn-icon" id="imageBtn" title="Gửi ảnh"><i class="fas fa-image"></i></button>
      <button class="btn" id="sendBtn">Gửi</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <!-- DÒNG CHỮ NHỎ THÔNG BÁO -->
    <div class="footer-note">
      Tin nhắn không được lưu trữ · <span>Made by TuanHai 💙</span>
    </div>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player" id="musicPlayer">
  <div class="progress-bar" id="progressBar" style="width:0%;"></div>
  <div class="player-info" id="playerInfo">
    <div class="cover"><i class="fas fa-music"></i></div>
    <div>
      <div class="song-title" id="songTitle">tìm em</div>
      <div class="song-artist" id="songArtist">hưng lê</div>
    </div>
  </div>
  <div class="player-controls">
    <button id="prevBtn" title="Bài trước"><i class="fas fa-step-backward"></i></button>
    <button id="playBtn" title="Phát / Tạm dừng"><i class="fas fa-play"></i></button>
    <button id="nextBtn" title="Bài tiếp"><i class="fas fa-step-forward"></i></button>
  </div>
  <div class="volume-control">
    <i class="fas fa-volume-up" style="font-size:14px;color:#94a3b8;"></i>
    <input type="range" id="volumeSlider" min="0" max="100" value="70" />
  </div>
  <button class="toggle-expand" id="toggleExpand"><i class="fas fa-chevron-down"></i></button>
</div>

<script>
  (function() {
    // ===== DOM =====
    const loginScreen = document.getElementById('loginScreen');
    const chatContainer = document.getElementById('chatContainer');
    const loginForm = document.getElementById('loginForm');
    const nameInput = document.getElementById('nameInput');
    const loginError = document.getElementById('loginError');
    const displayName = document.getElementById('displayName');
    const userAvatar = document.getElementById('userAvatar');
    const messageBox = document.getElementById('messageBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusLabel = document.getElementById('statusLabel');
    const statusDot = document.getElementById('statusDot');
    const fileInput = document.getElementById('fileInput');
    const imageBtn = document.getElementById('imageBtn');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const musicPlayer = document.getElementById('musicPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBar = document.getElementById('progressBar');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const toggleExpand = document.getElementById('toggleExpand');

    // ===== STATE =====
    let currentUser = '';
    let currentImageBase64 = null;
    let ws = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 10;

    // ===== MUSIC =====
    let audio = new Audio();
    let isPlaying = false;
    let isCollapsed = false;
    const playlist = [
      { title: 'tìm em', artist: 'hưng lê', src: 'music1.mp3' },
      { title: 'nơi này có anh', artist: 'Sơn Tùng', src: 'music2.mp3' },
      { title: 'Viết tiếp câu chuyện hòa bình', artist: 'Tùng Dương', src: 'music3.mp3' }
    ];
    let currentTrackIndex = 0;

    function loadTrack(index) {
      const track = playlist[index];
      if (!track) return;
      audio.src = track.src;
      songTitle.textContent = track.title;
      songArtist.textContent = track.artist;
      audio.load();
      if (isPlaying) {
        audio.play().catch(() => {});
      }
      updatePlayButton();
    }
    function updatePlayButton() {
      const icon = playBtn.querySelector('i');
      if (isPlaying) {
        icon.className = 'fas fa-pause';
        musicPlayer.classList.add('playing');
      } else {
        icon.className = 'fas fa-play';
        musicPlayer.classList.remove('playing');
      }
    }
    function togglePlay() {
      if (audio.src) {
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play().catch(() => {});
        }
        isPlaying = !isPlaying;
        updatePlayButton();
      }
    }
    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
    }
    function prevTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = progress + '%';
      }
    });
    audio.addEventListener('ended', () => {
      isPlaying = false;
      updatePlayButton();
      nextTrack();
    });
    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value / 100;
    });
    toggleExpand.addEventListener('click', (e) => {
      e.stopPropagation();
      isCollapsed = !isCollapsed;
      musicPlayer.classList.toggle('collapsed', isCollapsed);
      toggleExpand.querySelector('i').className = isCollapsed ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
    });
    playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevTrack(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
    musicPlayer.addEventListener('click', () => {
      if (isCollapsed) {
        isCollapsed = false;
        musicPlayer.classList.remove('collapsed');
        toggleExpand.querySelector('i').className = 'fas fa-chevron-down';
      }
    });

    function tryAutoPlay() {
      audio.play().then(() => {
        isPlaying = true;
        updatePlayButton();
      }).catch(() => {
        console.log('Autoplay bị chặn');
      });
    }

    // ===== CHAT =====
    const savedName = localStorage.getItem('chat_username');
    if (savedName) nameInput.value = savedName;

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        loginError.textContent = 'Vui lòng nhập tên của bạn.';
        return;
      }
      loginError.textContent = '';
      currentUser = name;
      displayName.textContent = name;
      userAvatar.textContent = name.charAt(0).toUpperCase();
      localStorage.setItem('chat_username', name);

      loginScreen.classList.add('hidden');
      chatContainer.classList.remove('hidden');

      loadTrack(0);
      setTimeout(tryAutoPlay, 300);

      connect();
    });

    function setStatus(label, type) {
      statusLabel.textContent = label;
      statusDot.className = 'dot ' + type;
    }

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host;
      const url = protocol + '//' + host;

      try {
        ws = new WebSocket(url);
      } catch (e) {
        setStatus('Lỗi kết nối', 'offline');
        return;
      }

      ws.onopen = () => {
        setStatus('Đã kết nối', 'online');
        reconnectAttempts = 0;
        ws.send(JSON.stringify({ type: 'join', username: currentUser }));
      };

      ws.onclose = () => {
        setStatus('Mất kết nối', 'offline');
        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          setStatus(`Đang kết nối lại... (${reconnectAttempts}/${MAX_RECONNECT})`, 'connecting');
          setTimeout(connect, 2000 * reconnectAttempts);
        } else {
          setStatus('Không thể kết nối', 'offline');
        }
      };

      ws.onerror = (err) => {
        console.warn('WebSocket lỗi:', err);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'system') {
            appendMessage(data.message, 'system');
            return;
          }
          const isMine = (data.username === currentUser);
          appendMessage(data.text, isMine ? 'mine' : 'other', data.username, data.image, data.timestamp);
        } catch (e) {
          console.error('Lỗi parse tin nhắn:', e);
        }
      };
    }

    function appendMessage(text, type, username = '', image = null, time = null) {
      const div = document.createElement('div');
      div.classList.add('message', type);
      if (type === 'system') {
        div.textContent = text;
      } else {
        const nameSpan = document.createElement('div');
        nameSpan.classList.add('username');
        nameSpan.textContent = username || 'Ẩn danh';
        div.appendChild(nameSpan);
        if (text) {
          const textSpan = document.createElement('div');
          textSpan.classList.add('text');
          textSpan.textContent = text;
          div.appendChild(textSpan);
        }
        if (image) {
          const img = document.createElement('img');
          img.src = image;
          img.alt = 'Hình ảnh';
          div.appendChild(img);
        }
        const timeSpan = document.createElement('div');
        timeSpan.classList.add('time');
        timeSpan.textContent = time || new Date().toLocaleTimeString();
        div.appendChild(timeSpan);
      }
      messageBox.appendChild(div);
      messageBox.scrollTop = messageBox.scrollHeight;
    }

    function sendMessage() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('Chưa kết nối được với server. Vui lòng kiểm tra lại.');
        return;
      }
      const text = messageInput.value.trim();
      if (!text && !currentImageBase64) {
        alert('Vui lòng nhập tin nhắn hoặc chọn ảnh.');
        return;
      }
      appendMessage(text, 'mine', currentUser, currentImageBase64, new Date().toLocaleTimeString());
      ws.send(JSON.stringify({
        username: currentUser,
        text: text || '',
        image: currentImageBase64 || null
      }));
      messageInput.value = '';
      clearImagePreview();
    }

    function clearImagePreview() {
      currentImageBase64 = null;
      imagePreview.style.display = 'none';
      previewImg.src = '#';
      fileInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    imageBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        currentImageBase64 = ev.target.result;
        previewImg.src = currentImageBase64;
        imagePreview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    });
    removeImageBtn.addEventListener('click', clearImagePreview);

    window.addEventListener('load', function() {
      if (savedName) {
        loginForm.dispatchEvent(new Event('submit'));
      }
    });
  })();
</script>
</body>
</html>
